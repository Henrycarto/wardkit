name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (Vitest, Testing Library, axe in jsdom)
        run: npm test
      - name: Registry build
        run: npm run registry:build
      - name: Check the committed registry is up to date
        run: git diff --exit-code public/r/
      - name: Docs build
        run: npm run build

  a11y:
    # axe in Chromium against every docs page, light and dark, desktop and phone. Covers colour contrast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:a11y

  hl7-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Official HL7 FHIR validator on every fixture
        run: npm run validate:fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hl7-validation
          path: validation.json
